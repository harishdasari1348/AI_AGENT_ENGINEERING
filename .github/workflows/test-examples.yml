name: Test example notebooks

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - ".github/workflows/test-examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/test-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          args=(-r examples/requirements-test.txt)
          while IFS= read -r f; do args+=(-r "$f"); done < <(find examples -mindepth 2 -name requirements.txt)
          pip install "${args[@]}"

      - name: Run notebooks
        working-directory: examples
        run: python -m pytest -v
